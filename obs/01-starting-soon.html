<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KP · Starting Soon</title>
<link rel="stylesheet" href="ledge.css">
</head>
<body class="with-bg">
<div id="root" style="position:absolute;inset:0"></div>
<script src="ledge.js"></script>
<script>
  const qs = new URLSearchParams(location.search);
  // URL params:
  //   channel   — Twitch channel for live pre-stream chat (keeps community warm)
  //   startAt   — "auto" (default when countdown is not set): counts down to the
  //               scheduled go-live, Saturday 10:00, other days 19:30 (UK clock).
  //               Or a fixed time, e.g. startAt=20:00
  //   countdown — minutes, counted from when the source loads (legacy; OBS keeps
  //               sources loaded, so this often hits 00:00 before you switch over)
  //   sim       — set to 0 to disable sim chat when no channel provided
  const channel   = qs.get('channel') || '';
  const countMin  = Number(qs.get('countdown')) || 0;
  const startAt   = (qs.get('startAt') || (countMin ? '' : 'auto')).trim();

  const root = document.getElementById('root');
  LedgeWatch.rooftop(root);
  LedgeWatch.topStrip(root);

  const typoEl = LedgeWatch.typo(root, 'STARTING', [
    '◆ ◆ ◆  stand by  ◆ ◆ ◆',
    'subject approaching the ledge. do not adjust your set.',
  ], { logo: 'assets/logo.png' });
  const line1 = typoEl.querySelector('.sub div:first-child');
  const pad = (n) => String(n).padStart(2, '0');

  // Work out the target time. Returns a Date, or null when we should just say "stand by".
  function targetTime() {
    const now = new Date();
    if (startAt) {
      let hh, mm;
      if (startAt.toLowerCase() === 'auto') {
        const sat = now.getDay() === 6;
        hh = sat ? 10 : 19; mm = sat ? 0 : 30;
      } else {
        const m = startAt.match(/^(\d{1,2}):?(\d{2})$/);
        if (!m) return null;
        hh = Number(m[1]); mm = Number(m[2]);
      }
      const t = new Date(now); t.setHours(hh, mm, 0, 0);
      return t;
    }
    if (countMin) { return new Date(loadedAt + countMin * 60000); }
    return null;
  }
  const loadedAt = Date.now();
  function render() {
    const t = targetTime();
    if (!t) { line1.textContent = '◆ ◆ ◆  stand by  ◆ ◆ ◆'; return; }
    const left = Math.round((t - Date.now()) / 1000);
    if (left <= 0) { line1.textContent = '◆ ◆ ◆  going live any second  ◆ ◆ ◆'; return; }
    if (left > 60 * 60) { line1.textContent = '◆ ◆ ◆  stand by  ◆ ◆ ◆'; return; } // off-schedule stream
    line1.textContent = `◆ ◆ ◆  begins in ${pad(Math.floor(left / 60))}:${pad(left % 60)}  ◆ ◆ ◆`;
  }
  render(); setInterval(render, 1000);

  // Pre-stream chat — keeps community visible before going live
  const simulate = channel ? false : (qs.get('sim') !== '0');
  const chat = LedgeWatch.chat(root, { simulate });
  if (channel) LedgeWatch.twitchChat(channel, (m) => chat.add(m));

  // Alerts — lets early follow/sub/raid hype pop before you even go live
  const alertHost = LedgeWatch.alertHost(root);

  LedgeWatch.ticker(root);
  LedgeWatch.bind({ alertHost, chat });

  window.LedgeWatch_test = {
    follow: () => alertHost.fire({ type: 'follow', name: 'flock_boss',     msg: 'followed the flock' }),
    sub:    () => alertHost.fire({ type: 'sub',    name: 'breadwhisperer', amount: 'Tier 3 · 6mo', msg: 'resubbed · 6 months deep' }),
    bits:   () => alertHost.fire({ type: 'bits',   name: 'TacticalRalph',  amount: '500 bits',     msg: 'tossed 500 bits' }),
    donate: () => alertHost.fire({ type: 'donate', name: 'anonymous',      amount: '£25.00',       msg: 'buy yourself a sandwich' }),
    raid:   () => alertHost.fire({ type: 'raid',   name: 'Vost0k_stream',  amount: '42 raiders',   msg: 'raiding with 42' }),
  };
</script>
</body>
</html>
