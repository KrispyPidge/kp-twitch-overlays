<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KP · Transmission pop-in (transparent)</title>
<link rel="stylesheet" href="ledge.css">
<!--
  "INCOMING" strip for gameplay scenes. Slides in for a few seconds every N minutes,
  shows ONE message, then leaves. Nothing stays on screen. Follows the auto palette.

  OBS: Browser Source, URL
    https://krispypidge.github.io/kp-twitch-overlays/obs/10-transmission.html
  Width 1000, Height 90. Top-left is usually clear of game HUDs.

  Params:
    every   minutes between appearances (default 20)
    show    seconds on screen (default 12)
    first   minutes before the first one (default 4)
    msgs    optional override, messages separated by |  e.g. msgs=line one|line two
    test=1  preview: appears every 20 seconds. Use it to position, then remove it.
-->
<style>
  html, body { width: 1000px; height: 90px; background: transparent; overflow: hidden; }
  body { padding-top: 14px; }
  .strip { display: inline-flex; align-items: stretch; transform: translateX(-110%);
           transition: transform .55s cubic-bezier(.2,.8,.2,1); filter: drop-shadow(0 3px 8px rgba(0,0,0,.6)); }
  .strip.on { transform: translateX(0); }
  .tag { background: var(--stamp); color: var(--paper); font-family: 'JetBrains Mono'; font-weight: 700;
         font-size: 13px; letter-spacing: 3px; padding: 0 14px 0 18px; display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--paper); animation: kp-red-blink 1s ease-in-out infinite; }
  .msg { background: var(--hl); color: var(--ink); font-family: 'Rubik Mono One'; font-size: 17px; letter-spacing: 1.5px;
         text-transform: uppercase; padding: 13px 24px 13px 18px; white-space: nowrap;
         box-shadow: inset 0 2px 0 rgba(0,0,0,.35), inset 0 -2px 0 rgba(0,0,0,.35);
         clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%); }
  .t { display: inline-block; clip-path: inset(0 100% 0 0); }
  .strip.on .t { animation: kp-type 1.1s steps(28, end) .45s forwards; }
  @keyframes kp-type { to { clip-path: inset(0 0 0 0); } }
</style>
</head>
<body>
<div class="strip" id="strip">
  <div class="tag"><span class="dot"></span><span>INCOMING</span></div>
  <div class="msg"><span class="t" id="t"></span></div>
</div>
<script src="ledge.js"></script>
<script>
  // One shows per appearance, in order. Keep each under ~55 characters. No em dashes.
  const DEFAULT_MESSAGES = [
    'New here? ◆ follow the flock ◆ say hi in chat',
    'Full VODs + Shorts ◆ YouTube @KrispyPidgeon',
    'Clips all week ◆ Instagram + X @krispypidgeon',
    'Subs unlock WUTPidge + MADPidge ◆ more coming',
  ];
  const qs = new URLSearchParams(location.search);
  const num = (k, d) => { const v = parseFloat(qs.get(k)); return isNaN(v) ? d : v; };
  const MESSAGES = qs.get('msgs') ? qs.get('msgs').split('|').map(s => s.trim()).filter(Boolean) : DEFAULT_MESSAGES;
  const test    = qs.get('test') === '1';
  const everyMs = test ? 20000 : num('every', 20) * 60000;
  const showMs  = test ? 8000  : num('show', 12) * 1000;
  const firstMs = test ? 1500  : num('first', 4) * 60000;
  const strip = document.getElementById('strip'), t = document.getElementById('t');
  let i = 0;
  function appear() {
    t.textContent = MESSAGES[i++ % MESSAGES.length];
    strip.classList.remove('on'); void strip.offsetWidth; strip.classList.add('on');
    setTimeout(() => strip.classList.remove('on'), showMs);
  }
  setTimeout(() => { appear(); setInterval(appear, everyMs); }, firstMs);
</script>
</body>
</html>
